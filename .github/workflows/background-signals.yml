name: Background Telegram Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  signals:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run signal engine
        run: node runner.mjs
